<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安装完成 · 元点Admin</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #1d2939; background: #f2f5fa; font: 16px/1.7 system-ui, sans-serif; }
        main { max-width: 560px; padding: 48px; border: 1px solid #e4e9f1; border-radius: 20px; background: white; box-shadow: 0 18px 60px #172b4d0a; }
        .brand { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: #4274dd; }
        h1 { margin: 18px 0 12px; font-size: 30px; }
        p { color: #667085; }
        a { display: inline-block; margin-top: 16px; padding: 10px 24px; border-radius: 8px; background: #3468d7; color: white; text-decoration: none; }
        a:focus-visible { outline: 3px solid #9fb8ee; outline-offset: 4px; }
        @media (max-width: 480px) { main { padding: 28px; } }
    </style>
</head>
<body>
<main>
    <div class="brand">元点Admin / 安装向导</div>
    <h1>系统已安装</h1>
    <p>__MESSAGE__</p>
    <p>现在可以登录管理后台，继续配置您的站点。</p>
    <a href="/admin/">进入管理后台 →</a>
</main>
</body>
</html>
