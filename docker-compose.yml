version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: yuandian-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./admin/dist:/usr/share/nginx/html
      - ./server/public:/var/www/html/public
      - ./server/public/storage:/var/www/html/public/storage
      - ./server/public/uploads:/var/www/html/public/uploads
    depends_on:
      - php
    networks:
      - yuandian
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: yuandian-php
    volumes:
      - ./server:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    networks:
      - yuandian
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: yuandian-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yuandian123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev007}
      MYSQL_USER: ${MYSQL_USER:-yuandian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yuandian123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yuandian
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yuandian-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yuandian
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  yuandian:
    driver: bridge
